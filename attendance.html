<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Attendance System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .stat-card h3 {
            color: #667eea;
            font-size: 0.9rem;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 3rem;
            font-weight: bold;
            color: #333;
        }

        .stat-card.present .number { color: #4CAF50; }
        .stat-card.absent .number { color: #f44336; }
        .stat-card.late .number { color: #ff9800; }
        .stat-card.rate .number { color: #2196F3; }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .employee-list {
            list-style: none;
        }

        .employee-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
            transition: background 0.3s;
        }

        .employee-item:hover {
            background: #f5f5f5;
        }

        .employee-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .status-present {
            background: #e8f5e9;
            color: #4CAF50;
        }

        .status-absent {
            background: #ffebee;
            color: #f44336;
        }

        .status-late {
            background: #fff3e0;
            color: #ff9800;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-checkin {
            background: #4CAF50;
            color: white;
        }

        .btn-checkout {
            background: #2196F3;
            color: white;
        }

        .btn-mark-absent {
            background: #f44336;
            color: white;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .time-display {
            font-size: 0.85rem;
            color: #666;
            margin-top: 5px;
        }

        .filter-section {
            margin-bottom: 20px;
        }

        .filter-section select {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
        }

        .weekly-chart {
            margin-top: 20px;
        }

        .chart-bar {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            height: 200px;
            padding: 20px 0;
        }

        .bar-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .bar {
            width: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 5px 5px 0 0;
            transition: height 0.5s;
        }

        .bar-label {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #666;
        }

        .bar-value {
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏢 Company Attendance System</h1>
            <p>Track and manage employee attendance efficiently</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card present">
                <h3>Present Today</h3>
                <div class="number" id="presentCount">0</div>
            </div>
            <div class="stat-card absent">
                <h3>Absent Today</h3>
                <div class="number" id="absentCount">0</div>
            </div>
            <div class="stat-card late">
                <h3>Late Arrivals</h3>
                <div class="number" id="lateCount">0</div>
            </div>
            <div class="stat-card rate">
                <h3>Attendance Rate</h3>
                <div class="number" id="attendanceRate">0%</div>
            </div>
        </div>

        <div class="main-content">
            <div class="card">
                <h2>👥 Employee List</h2>
                <div class="filter-section">
                    <select id="filterStatus" onchange="filterEmployees()">
                        <option value="all">All Employees</option>
                        <option value="present">Present</option>
                        <option value="absent">Absent</option>
                        <option value="late">Late</option>
                    </select>
                </div>
                <ul class="employee-list" id="employeeList">
                </ul>
            </div>

            <div class="card">
                <h2>📊 Weekly Statistics</h2>
                <div class="weekly-chart">
                    <div class="chart-bar" id="weeklyChart">
                    </div>
                </div>
                <div style="margin-top: 20px;">
                    <h3 style="margin-bottom: 10px;">Today's Summary</h3>
                    <p id="todaySummary" style="color: #666; line-height: 1.6;"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sample employee data
        const employees = [
            { id: 1, name: 'John Smith', email: 'john@company.com', status: 'present', checkIn: '09:00 AM', checkOut: '--:--' },
            { id: 2, name: 'Sarah Johnson', email: 'sarah@company.com', status: 'present', checkIn: '08:45 AM', checkOut: '--:--' },
            { id: 3, name: 'Mike Brown', email: 'mike@company.com', status: 'late', checkIn: '09:30 AM', checkOut: '--:--' },
            { id: 4, name: 'Emily Davis', email: 'emily@company.com', status: 'absent', checkIn: '--:--', checkOut: '--:--' },
            { id: 5, name: 'David Wilson', email: 'david@company.com', status: 'present', checkIn: '08:55 AM', checkOut: '--:--' },
            { id: 6, name: 'Lisa Anderson', email: 'lisa@company.com', status: 'absent', checkIn: '--:--', checkOut: '--:--' }
        ];

        const weeklyData = [
            { day: 'Mon', present: 5, total: 6 },
            { day: 'Tue', present: 6, total: 6 },
            { day: 'Wed', present: 4, total: 6 },
            { day: 'Thu', present: 5, total: 6 },
            { day: 'Fri', present: 3, total: 6 }
        ];

        function getInitials(name) {
            return name.split(' ').map(n => n[0]).join('');
        }

        function getStatusBadge(status) {
            const statusClass = `status-${status}`;
            const statusText = status.charAt(0).toUpperCase() + status.slice(1);
            return `<span class="status-badge ${statusClass}">${statusText}</span>`;
        }

        function renderEmployeeList(filter = 'all') {
            const list = document.getElementById('employeeList');
            list.innerHTML = '';

            const filteredEmployees = filter === 'all' 
                ? employees 
                : employees.filter(emp => emp.status === filter);

            filteredEmployees.forEach(emp => {
                const li = document.createElement('li');
                li.className = 'employee-item';
                li.innerHTML = `
                    <div class="employee-info">
                        <div class="avatar">${getInitials(emp.name)}</div>
                        <div>
                            <strong>${emp.name}</strong>
                            <div class="time-display">${emp.email}</div>
                            <div class="time-display">Check-in: ${emp.checkIn} | Check-out: ${emp.checkOut}</div>
                        </div>
                    </div>
                    <div class="actions">
                        ${getStatusBadge(emp.status)}
                        ${emp.status === 'absent' ? 
                            `<button class="btn btn-checkin" onclick="markAttendance(${emp.id}, 'present')">Check In</button>` :
                            `<button class="btn btn-checkout" onclick="markAttendance(${emp.id}, 'checkout')">Check Out</button>`
                        }
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function markAttendance(id, action) {
            const employee = employees.find(emp => emp.id === id);
            if (employee) {
                if (action === 'present') {
                    employee.status = 'present';
                    employee.checkIn = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                } else if (action === 'checkout') {
                    employee.checkOut = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                }
                updateStats();
                renderEmployeeList(document.getElementById('filterStatus').value);
            }
        }

        function filterEmployees() {
            const filter = document.getElementById('filterStatus').value;
            renderEmployeeList(filter);
        }

        function updateStats() {
            const present = employees.filter(e => e.status === 'present').length;
            const absent = employees.filter(e => e.status === 'absent').length;
            const late = employees.filter(e => e.status === 'late').length;
            const total = employees.length;
            const rate = ((present + late) / total * 100).toFixed(0);

            document.getElementById('presentCount').textContent = present;
            document.getElementById('absentCount').textContent = absent;
            document.getElementById('lateCount').textContent = late;
            document.getElementById('attendanceRate').textContent = `${rate}%`;

            document.getElementById('todaySummary').innerHTML = `
                <strong>Total Employees:</strong> ${total}<br>
                <strong>Present:</strong> ${present} (${((present/total)*100).toFixed(0)}%)<br>
                <strong>Absent:</strong> ${absent} (${((absent/total)*100).toFixed(0)}%)<br>
                <strong>Late:</strong> ${late} employees arrived after 9:00 AM
            `;
        }

        function renderWeeklyChart() {
            const chart = document.getElementById('weeklyChart');
            chart.innerHTML = '';

            weeklyData.forEach(day => {
                const percentage = (day.present / day.total) * 100;
                const barContainer = document.createElement('div');
                barContainer.className = 'bar-container';
                barContainer.innerHTML = `
                    <div class="bar-value">${day.present}/${day.total}</div>
                    <div class="bar" style="height: ${percentage * 1.5}px;"></div>
                    <div class="bar-label">${day.day}</div>
                `;
                chart.appendChild(barContainer);
            });
        }

        // Initialize
        updateStats();
        renderEmployeeList();
        renderWeeklyChart();
    </script>
</body>
</html>
